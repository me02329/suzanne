name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: the workspaces are linked by built output (shared/dist) and
      # the Prisma client is generated here, both needed by the tests.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Catalogues de traduction bien formés (bloquant) + état de la migration i18n.
      - name: i18n
        run: npm run i18n:check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suzanne
          POSTGRES_PASSWORD: suzanne
          POSTGRES_DB: suzanne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suzanne -d suzanne_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://suzanne:suzanne@localhost:5432/suzanne_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run migrate:deploy -w @suzanne/backend

      - name: Integration tests
        run: npm run test:integration
