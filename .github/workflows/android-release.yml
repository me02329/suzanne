name: Android release

# Publier une version de l'app Android :
#   git tag android-v1.1.0 && git push origin android-v1.1.0
# → APK signé (clé release des secrets) attaché à une release GitHub,
#   installable depuis le téléphone (page Releases du dépôt).
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Version
        id: version
        run: |
          name="${GITHUB_REF_NAME#android-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || name="0.0.${GITHUB_RUN_NUMBER}-dev"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "SUZANNE_VERSION_NAME=$name" >> "$GITHUB_ENV"
          # Croissant à chaque exécution : une mise à jour s'installe par-dessus.
          echo "SUZANNE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : voir android/README.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SUZANNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SUZANNE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUZANNE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUZANNE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Suzanne-${{ steps.version.outputs.name }}.apk"

      - name: Release GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Suzanne Android ${{ steps.version.outputs.name }}" \
            --notes "Application Android de Suzanne. Sur le téléphone : télécharge l'APK ci-dessous et ouvre-le (autorise l'installation depuis le navigateur). Une nouvelle version s'installe par-dessus l'ancienne."

      - name: Artefact (exécution manuelle)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: suzanne-apk
          path: android/dist/*.apk
