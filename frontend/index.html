<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17150f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Suzanne</title>
    <script>
      // Thème appliqué avant le premier rendu (évite le flash clair → sombre).
      // Même clé que usePersistedState('theme') : préfixe « suzanne_ », JSON.
      (function () {
        var theme = 'light';
        try {
          var raw = localStorage.getItem('suzanne_theme');
          if (raw) theme = JSON.parse(raw) === 'dark' ? 'dark' : 'light';
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) { /* stockage indisponible : thème clair */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
