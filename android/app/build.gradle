plugins {
    id 'com.android.application'
}

// Signature « release » : fournie par l'environnement (secrets GitHub en CI,
// voir .github/workflows/android-release.yml). Sans ces variables, l'APK
// release n'est pas signé et seul le build debug est installable.
def keystorePath = System.getenv('SUZANNE_KEYSTORE')
def hasReleaseKey = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'app.suzanne'
    compileSdk 35

    defaultConfig {
        applicationId 'app.suzanne'
        minSdk 29
        targetSdk 35
        // Version : fournie par le tag en CI (android-v1.2.0 → 1.2.0) ; le
        // versionCode doit croître à chaque release pour que la mise à jour
        // s'installe par-dessus l'ancienne version.
        versionCode((System.getenv('SUZANNE_VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('SUZANNE_VERSION_NAME') ?: '1.0')
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('SUZANNE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SUZANNE_KEY_ALIAS')
                keyPassword System.getenv('SUZANNE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Mode local (ADR 0011) : l'app web + le serveur embarqué, servis par l'app
    // elle-même (assets/local/), copiés depuis le build « local » du frontend.
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/localWeb')
        }
    }
    // Fichiers déjà compressés : stockés tels quels. (La base pré-migrée est en
    // .pgz : un .gz serait décompressé et renommé par l'empaquetage.)
    androidResources {
        noCompress += ['pgz']
    }
}

// Copie de frontend/dist-local (npm run build:local) dans les assets de l'APK.
def localWebDir = rootProject.file('../frontend/dist-local')
tasks.register('copyLocalWeb', Copy) {
    doFirst {
        if (!new File(localWebDir, 'index.html').exists()) {
            throw new GradleException("Mode local : ${localWebDir} absent. Lance d'abord, à la racine du dépôt : npm run build:local")
        }
    }
    from localWebDir
    // Le service worker ne sert pas en mode local (tout est déjà sur l'appareil).
    exclude 'sw.js'
    into layout.buildDirectory.dir('generated/localWeb/local')
}
tasks.named('preBuild') { dependsOn 'copyLocalWeb' }
