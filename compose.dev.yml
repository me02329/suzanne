services:
  postgres:
    image: postgres:16-alpine
    container_name: suzanne-lite-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: suzanne
      POSTGRES_PASSWORD: suzanne
      POSTGRES_DB: suzanne
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suzanne -d suzanne"]
      interval: 5s
      timeout: 3s
      retries: 5
