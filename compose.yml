services:
  suzanne:
    build: .
    image: suzanne:latest
    container_name: suzanne
    restart: unless-stopped
    networks:
      - proxy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      # Assistant IA : valeurs lues depuis le .env du serveur (la clé peut
      # aussi être saisie dans Paramètres, stockée en base).
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      # Pool Prisma (défaut 5, ouvert à la demande) : suffisant pour un foyer ;
      # à augmenter seulement si l'app rame avec beaucoup d'usagers simultanés.
      # DATABASE_POOL_MAX: "5"
      # Heap V8 plafonné à 128 Mo par le Dockerfile ; surchargez ici si besoin.
      # NODE_OPTIONS: "--max-old-space-size=128"
    mem_limit: 384m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Le Postgres de prod est externe (DATABASE_URL). Si vous l'hébergez vous-même
# (NAS, VPS…), appliquez les mêmes réglages basse consommation que le dev :
#
#   command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=10",
#             "-c", "maintenance_work_mem=32MB"]
#
# Avec le pool applicatif plafonné à 5 connexions, Postgres tient
# confortablement sous ~100 Mo.

networks:
  proxy:
    external: true
