services:
  suzanne-lite:
    build: .
    image: suzanne-lite:latest
    container_name: suzanne-lite
    restart: unless-stopped
    networks:
      - proxy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    mem_limit: 384m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
